<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Password Shield</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .shield-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }

        .output-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }

        #passwordOutput {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            color: #38bdf8;
            word-break: break-all;
        }

        .strength-meter {
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #strengthBar {
            height: 100%;
            width: 0%;
            transition: 0.4s;
        }

        .settings {
            display: grid;
            gap: 15px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="range"] { width: 100%; margin: 10px 0; }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { filter: brightness(1.2); }
        
        .copy-icon { cursor: pointer; color: #94a3b8; }
        .copy-icon:hover { color: white; }
    </style>
</head>
<body>

<div class="shield-card">
    <h2 style="margin-top:0">Password Shield</h2>
    
    <div class="output-box">
        <span id="passwordOutput">P@ssw0rd123</span>
        <span class="copy-icon" onclick="copyToClipboard()">📋</span>
    </div>

    <div class="strength-meter">
        <div id="strengthBar"></div>
    </div>

    <div class="settings">
        <div class="setting-item">
            <span>Uzunlik: <b id="lengthVal">12</b></span>
        </div>
        <input type="range" id="length" min="6" max="30" value="12" oninput="generate()">
        
        <div class="setting-item">
            <label>Belgilar (!@#$)</label>
            <input type="checkbox" id="symbols" checked onchange="generate()">
        </div>
        
        <div class="setting-item">
            <label>Raqamlar (123)</label>
            <input type="checkbox" id="numbers" checked onchange="generate()">
        </div>
    </div>

    <button onclick="generate()">YANGI PAROL</button>
</div>

<script>
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const nums = "0123456789";
    const syms = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

    function generate() {
        const length = document.getElementById('length').value;
        const useNums = document.getElementById('numbers').checked;
        const useSyms = document.getElementById('symbols').checked;
        document.getElementById('lengthVal').innerText = length;

        let charset = chars;
        if (useNums) charset += nums;
        if (useSyms) charset += syms;

        let password = "";
        for (let i = 0; i < length; i++) {
            password += charset.charAt(Math.floor(Math.random() * charset.length));
        }

        document.getElementById('passwordOutput').innerText = password;
        checkStrength(password);
    }

    function checkStrength(pwd) {
        const bar = document.getElementById('strengthBar');
        let score = 0;
        
        if (pwd.length > 8) score += 25;
        if (/[0-9]/.test(pwd)) score += 25;
        if (/[!@#$%^&*]/.test(pwd)) score += 25;
        if (/[A-Z]/.test(pwd)) score += 25;

        bar.style.width = score + "%";
        
        if (score <= 25) bar.style.backgroundColor = 'var(--danger)';
        else if (score <= 50) bar.style.backgroundColor = 'var(--warning)';
        else if (score <= 75) bar.style.backgroundColor = 'var(--primary)';
        else bar.style.backgroundColor = 'var(--success)';
    }

    function copyToClipboard() {
        const pwd = document.getElementById('passwordOutput').innerText;
        navigator.clipboard.writeText(pwd);
        alert("Parol nusxalandi!");
    }

    // Birinchi marta yaratish
    generate();
</script>

</body>
</html>
